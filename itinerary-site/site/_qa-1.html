  <h2>picchio-musasabi <small>Flying squirrel watching, Karuizawa · experience · 7 photos</small>
  <b class="ok">coverage ok</b></h2>
  <div class="g"><figure>
    <img src="img/picchio-musasabi-01-t.jpg" alt="">
    <figcaption><b>1. wildlife</b> A musasabi filling the entrance hole of a wooden nest box, head and one clawed forefoot out, photographed in Nagakura, Karuizawa — grizzled grey-brown face, broad white cheek stripes, large pink nose and clearly protruding rounded ears, and a head wide enough to fill a fist-sized hole<i>1600×1200</i></figcaption>
  </figure><figure>
    <img src="img/picchio-musasabi-02-t.jpg" alt="">
    <figcaption><b>2. wildlife</b> Close-up from Picchio's own tour page: a musasabi looking out over the lip of a nest box with both forefeet hooked over the weathered timber, long white whiskers fanned out and every claw visible<i>1600×800</i></figcaption>
  </figure><figure>
    <img src="img/picchio-musasabi-03-t.jpg" alt="">
    <figcaption><b>3. wildlife</b> The whole animal at night, out on a lichen-covered branch against black forest: rufous-brown back, white belly and the loose fold of gliding membrane hanging along the flank — a cat-sized body next to a wrist-thick branch, which is the scale difference from the much smaller momonga<i>1200×800</i></figcaption>
  </figure><figure>
    <img src="img/picchio-musasabi-04-t.jpg" alt="">
    <figcaption><b>4. wildlife</b> Two musasabi in mid-glide at night over the tops of the conifers, patagium pulled taut into a square between wrists and ankles and the flat rudder-like tail trailing — the near animal lit from below, the far one already halfway to the next tree<i>1080×600</i></figcaption>
  </figure><figure>
    <img src="img/picchio-musasabi-05-t.jpg" alt="">
    <figcaption><b>5. activity</b> A frame off Picchio's nest-box camera, timestamp burned in, showing a musasabi curled asleep on shredded bark bedding inside the box with daylight coming through the entrance hole — this live feed is what the group watches on a monitor before the animal comes out<i>1600×900</i></figcaption>
  </figure><figure>
    <img src="img/picchio-musasabi-06-t.jpg" alt="">
    <figcaption><b>6. people</b> A Picchio guide with a spotting scope over his shoulder walking two guests along a soft earth trail in the Karuizawa Wild Bird Forest, both guests wearing binoculars — the forest the flying-squirrel tour walks into, shown here in daylight<i>1600×1067</i></figcaption>
  </figure><figure>
    <img src="img/picchio-musasabi-07-t.jpg" alt="">
